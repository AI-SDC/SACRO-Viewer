[build-system]
requires = ["hatchling", "hatch-requirements-txt"]
build-backend = "hatchling.build"

[project]
name = "Sacroviewer"
version = "0.1.0"
description = "A viewer for research outputs produced using the ACRO tools"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dynamic = ["dependencies"]
maintainers = [
    {name = "Jim Smith", email = "james.smith@uwe.ac.uk"}
]
keywords = [
    "output-viewer",
    "data-privacy",
    "data-protection",
    "privacy",
    "privacy-tools",
    "statistical-disclosure-control",
    "statistical-software",
]

[tool.hatch.metadata.hooks.requirements_txt]
files = ["requirements.prod.in"]

[tool.hatch.build.targets.wheel]
packages = ["sacro"]
artifacts = ["sacro/static"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[project.scripts]
sacroviewer = "sacro.__main__:main"

[project.urls]
"Homepage" = "https://github.com/AI-SDC/SACRO-Viewer"
"Bug Tracker" = "https://github.com/AI-SDC/SACRO-Viewer/issues"

[tool.coverage.run]
branch = true
dynamic_context = "test_function"
omit = [
  ".venv/*",
  "sacro/__main__.py",
  "sacro/asgi.py",
  "sacro/middleware.py",
  "sacro/urls.py",
  "sacro/views.py",
]
source = [
  "sacro",
  "tests",
]

[tool.coverage.report]
fail_under = 100
skip_covered = true
show_missing = true

[tool.coverage.html]
show_contexts = true

[tool.pytest.ini_options]
addopts = "--ignore=./build"
DJANGO_SETTINGS_MODULE = "sacro.settings"
filterwarnings = [
  "ignore::DeprecationWarning:slippers",
]

[tool.ruff]
line-length = 88
exclude = [
  ".direnv",
  ".git",
  ".github",
  ".ipynb_checkpoints",
  ".pytest_cache",
  ".venv",
  "__pycache__",
  "docker",
  "htmlcov",
  "venv",
  "data",
]
extend-select = [
  "A",  # flake8-builtins
  "I",  # isort
  "INP",  # flake8-no-pep420
  "ISC",  # flake8-implicit-str-concat
  "UP",  # pyupgrade
  "W",  # pycodestyle warning
]
extend-ignore = [
  "E501",
  "E731",
]

[tool.ruff.per-file-ignores]
"docs/source/conf.py" = ["A001", "INP001", "I001"]
"data/**" = ["INP001"]

[tool.ruff.isort]
lines-after-imports = 2
